
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Cinema News - Official</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0a0a0a;color:#fff;overflow-x:hidden}
header{background:linear-gradient(90deg,#ff0040,#ff8a00);padding:15px;text-align:center;position:sticky;top:0;z-index:100}
header h1{font-size:28px;font-weight:800;letter-spacing:1px}
.tag{background:#fff;color:#ff0040;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:10px}
.hero{padding:60px 20px;text-align:center;background:radial-gradient(circle at top,#1a1a1a,#000)}
.hero h2{font-size:42px;background:linear-gradient(90deg,#ff0040,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.hero p{color:#aaa;font-size:18px;margin-bottom:30px}
.btn{display:inline-block;background:linear-gradient(90deg,#ff0040,#ff8a00);color:#fff;padding:14px 30px;border-radius:30px;text-decoration:none;font-weight:600;font-size:18px;box-shadow:0 5px 20px rgba(255,0,64,0.4)}
.stats{display:flex;justify-content:center;gap:30px;margin-top:40px;flex-wrap:wrap}
.stat{background:#151515;padding:20px 30px;border-radius:15px;border:1px solid #222}
.stat h3{font-size:32px;color:#ffcc00}
.stat p{color:#888}
.section{padding:40px 20px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}
.card{background:#151515;border-radius:15px;padding:20px;border:1px solid #222;transition:0.3s}
.card:hover{transform:translateY(-5px);border-color:#ff0040}
.card h4{color:#ffcc00;margin-bottom:10px}
.footer{background:#111;padding:30px;text-align:center;color:#666;margin-top:40px;border-top:1px solid #222}
.footer a{color:#ff0040;text-decoration:none}
</style>
</head>
<body>

<header>
<h1>TAMIL CINEMA NEWS <span class="tag">1.5M+ Followers</span></h1>
</header>

<div class="hero">
<h2>Official Website</h2>
<p>
